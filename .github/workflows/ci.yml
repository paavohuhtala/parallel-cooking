# One workflow, because there is one deployable: checks and the e2e suite run in
# parallel, and the image is only built once both are green. Pushes to GHCR
# happen on the default branch only — a pull request builds the image to prove
# the Dockerfile still works, and throws it away.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      force-push:
        description: 'Push the image to GHCR even off the default branch (tagged with the SHA, never latest)'
        default: false
        type: boolean

# A new push to the same branch makes the run in flight pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No version here: the action reads `packageManager` from package.json,
      # which is the same pin corepack uses locally and in the Dockerfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `tsc -b` covers all three projects, the Playwright one included, and is
      # the only gate — there is no linter.
      - run: pnpm build

      # zod must not reach the client bundle.
      - run: pnpm check:bundle

      - run: pnpm test

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm blocks install scripts, so the browser is never downloaded by the
      # install itself. `--with-deps` adds the system libraries Chromium needs
      # on a bare runner; `pnpm e2e:install` is the plain local equivalent.
      - run: pnpm exec playwright install --with-deps chromium

      # globalSetup builds the client and each worker starts its own server, so
      # there is nothing to spin up here.
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Build & publish image
    runs-on: ubuntu-latest
    needs: [check, e2e]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A pull request builds but never pushes, so it needs no registry login —
      # and a fork's token could not get one.
      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=${{ github.ref_name == github.event.repository.default_branch }}
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || inputs.force-push) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The two `pnpm install` layers are the slow part and only change with
          # the lockfile, so the cache earns its keep.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest build provenance
        if: ${{ steps.build.outputs.digest && github.event_name != 'pull_request' && (github.ref_name == github.event.repository.default_branch || inputs.force-push) }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
